[project]
name = "memory-steering-bench"
version = "0.1.0"
description = "Can one compromised agent steer a team through shared memory? Swarm Alignment Hackathon 2026, Track 2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pandas",
    "faker",
    "python-dotenv",
    "openai>=3.46.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_steering"]

[tool.uv]
# Use uv's own Python builds; avoids broken system/MacPorts interpreters.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
